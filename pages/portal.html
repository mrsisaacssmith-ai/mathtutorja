<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal — Math Tutor JA</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../" data-page="portal">

<div class="dash-shell">
  <aside class="dash-side">
    <a href="../index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke="#D6A419" stroke-width="2"/>
        <path d="M13 28L20 10L27 28" stroke="#FAF9F6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16.5 21H23.5" stroke="#F0C24A" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span>Math Tutor <span class="logo-ja" style="color:#F0C24A;">JA</span></span>
    </a>
    <ul class="dash-nav">
      <li><a href="#" class="active">📅 My schedule</a></li>
      <li><a href="#">📚 Class materials</a></li>
      <li><a href="#">💳 Payments</a></li>
      <li><a href="#">👤 Profile</a></li>
      <li><a href="../index.html">← Back to site</a></li>
    </ul>
  </aside>

  <main class="dash-main">
    <div class="dash-top">
      <div>
        <span class="eyebrow">Welcome back</span>
        <h1 style="font-size:1.5rem; margin-top:6px;" id="welcomeName">Hi there</h1>
      </div>
      <span class="tag" id="statusTag" style="display:none;"></span>
    </div>

    <div class="grid-2" style="margin-bottom:36px;" id="bookingCards">
      <div class="card"><p style="color:var(--slate); font-size:0.9rem;">Loading your bookings…</p></div>
    </div>

    <h2 style="font-size:1.15rem; margin-bottom:14px;" id="materialsHeading">Class materials</h2>
    <div class="grid-2" id="materialsGrid">
      <p style="color:var(--slate); font-size:0.9rem;">Loading materials…</p>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/components.js"></script>
<script src="../js/portal.js"></script>
</body>
</html>
